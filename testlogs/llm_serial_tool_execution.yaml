metadata:
  name: "LLM Serial Tool Execution"
  description: "LLM uses get_website tool, routed to HTTP node, then end"
  version: "1.0.0"
nodes:
  ask:
    type: "llm"
    params:
      provider: "openai"
      api_key: "${secrets.OPENAI_API_KEY}"
      model: "gpt-4o-mini"
      temperature: 0.2
      question: "Use the get_website tool to fetch https://httpbin.org/json and then summarize it."
      tools:
        - type: function
          function:
            name: get_website
            description: Fetch a URL and return its textual content
            parameters:
              type: object
              properties:
                url:
                  type: string
                  description: URL to fetch
              required: [url]
      options:
        tool_choice:
          type: function
          function:
            name: get_website
    next:
      default: "route"

  route:
    type: "router"
    next:
      get_website: "http"
      output: "END"

  http:
    type: "http.request"
    params:
      url: "${shared.result.tool_params.url}"
      method: "GET"
      headers:
        User-Agent: "FlowRunner-Tests"
      timeout: "10s"
    next:
      success: "END"
      default: "END"
