metadata:
  name: "LLM Serial Tool Test (Direct API)"
  description: "Test LLM node with direct API key"
  version: "1.0.0"

nodes:
  start:
    type: transform
    params:
      script: |
        return {
          question: "Search for information at https://httpbin.org/json and then send an email summary to beatsbybuddha@gmail.com",
          context: "llm-serial-tool-test"
        };
    next:
      default: llm_node

  llm_node:
    type: llm
    params:
      provider: openai
      api_key: "DIRECT_API_KEY_PLACEHOLDER"
      model: gpt-4o-mini
      temperature: 0.3
      max_tokens: 500
      prompt: "Search for information at https://httpbin.org/json and then send an email summary to beatsbybuddha@gmail.com"
      tools:
        - type: function
          function:
            name: get_website
            description: Fetch content from a website URL
            parameters:
              type: object
              properties:
                url:
                  type: string
                  description: The URL to fetch content from
              required: ["url"]
        - type: function
          function:
            name: send_email
            description: Send an email with subject and body
            parameters:
              type: object
              properties:
                subject:
                  type: string
                  description: Email subject line
                body:
                  type: string
                  description: Email body content
                recipient:
                  type: string
                  description: Email recipient address
              required: ["subject", "body", "recipient"]
    next:
      default: end

  end:
    type: transform
    params:
      script: |
        return {
          final_response: input.content || input.message || "LLM execution completed",
          llm_result: input,
          execution_summary: {
            completed_successfully: !input.error,
            final_status: input.error ? "failed" : "completed"
          }
        };